# Vitis HLS config -- GRAMPC IPMSM speed-MPC baseline
# Same part & clock as the DNN clone (system_top) so the comparison is fair.
part=xc7z045ffg900-2
flow_target=vivado
package.output.format=ip_catalog

syn.top=foo_user_PMSM

# --- design sources ---
# NOTE: grampc_init.c is deliberately EXCLUDED. The static struct literal in
# initialize_PMSM.h replaces grampc_init(), and grampc_init.c is where all the
# malloc/calloc/free live. Including it would drag dynamic allocation into the
# design and break synthesis. The build links fine without it.
syn.file=../foo_user_PMSM.cpp
syn.file=../probfct_PMSM_speed_static.c
syn.file=../grampc_run.c
syn.file=../grampc_util_hls.c
syn.file=../grampc_intsys_bridge.c

# --- testbench ---
tb.file=../foo_user_PMSM_tb.cpp

clock=12ns
